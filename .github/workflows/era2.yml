# =====================================================================================
#  P-E8 -- LA CI: i collaudi girano A OGNI PUSH, e FUORI DAL PC DI LUCA
# -------------------------------------------------------------------------------------
#  ### PERCHE' CONTA, e non e' una comodita': i hook del `pre-commit` vivono in
#  ### `.githooks/`, e valgono SOLO SE qualcuno ha dato `git config core.hooksPath
#  ### .githooks`. Per `A9` un presidio che dipende da un comando dato a mano
#  ### E' UNA TENDA: chi clona il repo e non lo da' NON HA NESSUN PRESIDIO.
#
#  ### ⛔ MA QUESTA CI NON E' UN PRESIDIO, E QUI PRIMA C'ERA SCRITTO IL CONTRARIO.
#  ### Avevo scritto: <<LA CI NON SI PUO' DIMENTICARE: gira sul server, a ogni push,
#  ### e NON HA VIA D'USCITA -- come i presidi di primo_ordine/>>, e stavo per
#  ### dichiararla NEL REFERTO il gradino di robustezza di questo mandato.
#
#  ### E' FALSO, E LO ERA SEMPRE STATO. Luca ha deciso (2026-10-09): NESSUNA
#  ### protezione del ramo su GitHub. Quindi QUESTA CI GIRA DOPO IL PUSH E NON PUO'
#  ### IMPEDIRE NIENTE: e' UNA RETE CHE SEGNALA.
#
#  ### E non mi serviva la decisione di Luca per vederlo: bastava chiedermi
#  ### <<questa CI PUO' impedire un commit?>>. Avevo trasferito alla CI una
#  ### proprieta' VERA dei presidi di primo_ordine/ (che davvero non hanno fuga,
#  ### perche' il loro codice non legge nessuna fuga) DOVE NON VALE.
#
#  ### A COSA SERVE ALLORA, e non e' poco: i hook locali valgono SOLO SE qualcuno ha
#  ### dato `git config core.hooksPath .githooks`, e per A9 un presidio che dipende
#  ### da un comando dato a mano E' UNA TENDA. Questa CI SEGNALA a chi guarda che
#  ### quella tenda non ha tenuto -- e un --no-verify, che in locale NON E'
#  ### IMPEDIBILE, qui si vede.
#
#  ### ⚠ E NON E' MAI STATA OSSERVATA GIRARE. Il referto lo dice: per A9 la
#  ### differenza fra <<scritto>> e <<osservato>> e' quella fra una tenda e un muro.
# =====================================================================================
name: era2

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  presidi:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # ### LA STORIA INTERA: `F5`, `F11` e il commit di chiusura leggono `git log`
          # ### e `git show` -- con un clone superficiale TACEREBBERO, e un presidio che
          # ### tace per un motivo tecnico E' PEGGIO DI UN PRESIDIO CHE NON C'E'.
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: le dipendenze
        run: python -m pip install --upgrade pip && pip install -r requirements.txt

      - name: il validatore dell-indice
        run: python csv/indice.py valida

      - name: i registri dell-era 2
        run: python csv/indice.py era2-valida

      - name: P-E1..P-E5 e P-E7, sul disco
        run: python csv/_presidi_era2.py

      - name: il collaudo dei presidi dell-era 2, nei due versi
        run: python csv/_presidi_era2.py --collaudo

      - name: lo schema della tabella
        run: python primo_ordine/leggi/schema.py

      - name: il collaudo del generatore
        run: python primo_ordine/_collauda_genera.py

      - name: "### E IL GENERATO E- RIPRODUCIBILE -- si rigenera e NON cambia"
        # ### ⛔ E' il controllo che rende VERA la frase <<i file generati non si
        # ### modificano a mano>>: se qualcuno tocca un file generato, la rigenerazione
        # ### lo riscrive e `git diff` NON E' VUOTO.
        run: |
          python primo_ordine/_genera.py
          git diff --exit-code -- primo_ordine doc/leggi_era2

      - name: "### `P-ID` -- un ID che nasce non puo- collidere"
        run: |
          python csv/_id_nuovo.py
          python csv/_id_nuovo.py --collaudo

      - name: "### IL REFERTO DELLA SECONDA PARTE -- rigenerato CON i lenti"
        # ### ⛔ Con `--con-lenti`: il collaudo della catena supera i 120
        # ### secondi, e nel `pre-commit` NON sta. Qui ci sta, e `git diff`
        # ### fa in modo che un referto SCADUTO non passi inosservato.
        run: |
          python csv/_referto_seconda_parte.py --con-lenti
          git diff --exit-code -- doc/REFERTO_seconda_parte_era2.md

      - name: "### `P-DET` -- il determinismo, e DUE PROCESSI byte-identici"
        # ### \u26a0 In CI la piattaforma e- Linux e le versioni sono PIU- NUOVE del
        # ### blocco: il presidio NON ferma (ferma solo per una PIU- VECCHIA) e la
        # ### differenza ### **va nel timbro**. ### Qui si vede se quella scelta tiene.
        run: python primo_ordine/_collauda_determinismo.py

      - name: "### `P-GRAFO` -- il grafo valido a ogni passo, e il COSTO misurato"
        run: python primo_ordine/_collauda_grafo.py

      - name: "### `P-ALB` -- l-albero delle scelte, nei due versi"
        run: |
          python csv/_albero_era2.py --collaudo
          python csv/indice.py valida

      - name: "### L-ARBITRO FRA LE DUE VIE -- e il `git diff` dei registri"
        # ### ⛔ Qui si pretende di piu- che nel `pre-commit`: oltre al collaudo,
        # ### ### **un giro del generatore e la diff VUOTA**. Cosi- un record
        # ### dell-era 2 cancellato ### **fa cadere la CI**, che e- esattamente cio-
        # ### che prima NON succedeva.
        run: |
          python csv/_registri_indice.py --collaudo
          python csv/_registri_indice.py
          git diff --exit-code -- doc/indice/leggi.jsonl doc/indice/variabili.jsonl doc/indice/assiomi.jsonl doc/indice/decisioni.jsonl

      - name: "### IL REFERTO DEL PIANO -- rigenerato, e `git diff`"
        run: |
          python csv/_referto_piano_era2.py
          git diff --exit-code -- doc/REFERTO_piano_era2.md

      - name: "### IL REFERTO DELLE 43 DECISIONI -- rigenerato, e `git diff`"
        # ### ⛔ Un referto SCADUTO dice numeri che non sono quelli di oggi, e
        # ### ### **sembra fatto**. Qui si rigenera e si pretende che la diff sia
        # ### VUOTA: cosi- un numero che si muove ### **fa cadere la CI**, invece di
        # ### restare scritto in un file che nessuno rigira.
        run: |
          python csv/_referto_decisioni_43.py
          git diff --exit-code -- doc/REFERTO_decisioni_43_era2.md

      - name: "### `P-AB` e `rinomina` -- i confronti, i dati, e il rinominamento"
        run: |
          python csv/_confronti_e_dati.py
          python csv/_confronti_e_dati.py --collaudo
          python csv/_rinomina.py

      - name: "### IL MODELLO DI SIGILLO -- i quattro bracci del rito (punto 7)"
        run: python primo_ordine/sigilli/_modello.py

      - name: "### `P-MOD` -- la modularita- non si degrada"
        run: |
          python csv/_modularita_era2.py
          python csv/_modularita_era2.py --collaudo

      - name: "### `P-ES1` -- un solo esecutore, e il TIMBRO"
        run: |
          python csv/_un_solo_esecutore.py
          python csv/_un_solo_esecutore.py --collaudo
          python primo_ordine/driver.py primo_ordine/config/prova.yaml

      - name: "### `@rif` e `P-RIF` -- un ID nel codice e- un costrutto, non prosa"
        run: |
          python primo_ordine/_rif.py
          python csv/_rif_nel_codice.py
          python csv/_rif_nel_codice.py --collaudo
          git diff --exit-code -- doc/RIFERIMENTI_era2.md

      - name: "### `P-T3` -- le citazioni strutturate, ri-verificate su git show"
        run: |
          python csv/_citazioni_strutturate.py
          python csv/_citazioni_strutturate.py --collaudo

      - name: "### `P-T2` -- il replay su tutti i registri, e i generati (CON i lenti)"
        run: |
          python csv/_replay_registri.py --con-lenti
          python csv/_replay_registri.py --collaudo

      - name: "### `P-R1` -- ogni ramo della fisica e- dichiarato"
        run: |
          python csv/_rami_era2.py
          python csv/_rami_era2.py --collaudo

      - name: "### `P-T1` -- il testo libero non si interpreta per decidere"
        run: |
          python csv/_testo_e_metadati.py
          python csv/_testo_e_metadati.py --collaudo

      - name: "### `P-C1` -- anche i controlli stanno nell-indice"
        run: |
          python csv/_controlli_nell_indice.py
          python csv/_controlli_nell_indice.py --collaudo

      - name: "### `P-M1` -- il documento dei metodi non invecchia in silenzio"
        # ### Gira sul disco (e RIGENERA il documento), poi il collaudo nei due
        # ### versi, poi `git diff`: un documento scaduto NON passa inosservato.
        run: |
          python csv/_metodi_era2.py
          python csv/_metodi_era2.py --collaudo
          git diff --exit-code -- doc/METODI_era1_in_era2.md

      - name: "### IL COLLAUDO DELLA CATENA -- lo schedulatore, il cono, i SEI casi"
        # ### E- il collaudo che il mandato chiama <<di TUTTA LA CATENA>>: i tre
        # ### livelli dello schedulatore, il CONO per passo e per strato, la deriva dei
        # ### due candidati, `A8b`, e i sei casi che DEVONO fallire.
        run: python primo_ordine/_collauda_passo.py

      - name: "### E IL REFERTO SI RIGENERA, e NON cambia"
        # ### ⛔ Il referto prende OGNI numero dall-uscita dei collaudi (`L-NUMERI`).
        # ### Se un numero cambiasse e il referto restasse quello di ieri, `git diff`
        # ### NON SAREBBE VUOTO -- quindi un referto scaduto NON PUO- passare inosservato.
        run: |
          python csv/_referto_infrastruttura_era2.py
          git diff --exit-code -- doc/REFERTO_infrastruttura_era2.md

      - name: il collaudo dei presidi dell-indice
        run: python csv/_collaudo_presidi_indice.py

      - name: i controlli della migrazione
        run: python csv/_controlli_indice_v2.py
