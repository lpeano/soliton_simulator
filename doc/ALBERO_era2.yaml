# ====================================================================================
#  L-ALBERO DELLE SCELTE DELL-ERA 2 -- L-UNICA FONTE
# ------------------------------------------------------------------------------------
#  I nodi di doc/indice/decisioni.jsonl SI GENERANO da qui
#  (csv/_registri_indice.py::leggi_le_decisioni), e lo schema che valida questa
#  tabella e- csv/_albero_era2.py, che e- anche IL PRESIDIO.
#
#  NIENTE SI SCRIVE A MANO IN doc/indice/decisioni.jsonl: quel file e- GENERATO, e un
#  nodo scritto la- dentro SAREBBE CANCELLATO al primo giro del generatore. Misurato
#  il 2026-10-10, ed e- il difetto DUE-VIE-SU-LEGGI-JSONL.
# ====================================================================================
#
#  IL FORMATO DI UN NODO
#  ---------------------
#    id              DEC-[A-Z0-9-]{3,}  -- almeno 4 caratteri, unico
#    etichetta       l-ETICHETTA LOCALE con cui Luca lo ha nominato (D9, D13, INT...).
#                    ### E- UN CAMPO, non l-id: par. 9 dice che un-etichetta locale NON
#                    e- un ID, e D2/D4/D5/D6 SONO GIA- OMONIMI DELL-ERA 1 -- un id di
#                    due caratteri sarebbe anche RIFIUTATO da P-ID.
#    titolo          una riga
#    argomento_noto  true/false. ### FALSE VUOL DIRE CHE IL REPO NON DICE DI CHE COSA
#                    SI DECIDE, e allora il nodo NON PUO- essere `presa` e porta una
#                    DOMANDA. Non si indovina: si chiede.
#    dipende_da      la lista degli id da cui dipende (anche vuota)
#    presa           true/false
#    fonte           dove Luca lo ha detto
#
#  IL PRESIDIO, in una riga: UN NODO `presa` CON UNA DIPENDENZA NON `presa` FA FALLIRE
#  LA VALIDAZIONE. ### E- la differenza fra una DIREZIONE DICHIARATA e una DECISIONE
#  PRESA, che e- esattamente cio- che questo albero serve a tenere separato.
#
# ====================================================================================

nodi:

  # ----------------------------------------------------------------------------------
  #  LA CATENA, come il mandato la scrive:
  #    D9 geometria -> D13 memorie -> D6 vuoto -> D7 divisione
  # ----------------------------------------------------------------------------------

  # ----------------------------------------------------------------------------------
  #  LA CATENA RICABLATA SULLA CAMMINATA  --  decisione di Luca, 2026-10-10
  # ----------------------------------------------------------------------------------
  #  L-albero vecchio era D9 -> D13 -> D6 -> D7, e lo scrivo perche- la differenza
  #  conta: era costruito PRIMA della decisione sulla camminata, quando la dinamica
  #  era <<densita- di H>>. Con la camminata il vuoto e- STATO INTERNO del nodo,
  #  mescolato dalla moneta e condotto dallo spostamento: NON USA DISTANZE. Quindi
  #  la geometria NON viene prima del vuoto, e la risposta alla domanda che avevo
  #  registrato in c9f194a e c38d32b (<<il vuoto locale si puo- decidere senza
  #  sapere che cos-e- una distanza?>>) e- SI-.

  - id: DEC-CAM-CAMMINATA
    etichetta: CAM
    titolo: "la dinamica e- una camminata quantistica a moneta"
    argomento_noto: true
    dipende_da: []
    presa: true
    fonte: "doc/CODA_2026-10-09.md::la camminata quantistica a moneta, punto 1"
    nota: >
      DECISIONE DI LUCA, 2026-10-10: la dinamica dell-era 2 e- una CAMMINATA
      QUANTISTICA A MONETA, un-unica regola per tutte le grandezze. Il contenuto
      sta nella voce CAMMINATA-A-MONETA. ### E- LA RADICE DELLA CATENA NUOVA:
      l-anisotropia dell-integratore a strati nasce dall-ORDINE degli strati, che
      A17 esclude dalla fisica -- quindi la direzione viene DA UN ASSIOMA.

  - id: DEC-QC-CONSERVATA
    etichetta: QC
    titolo: "esiste una quantita- conservata su cui fare il bilancio della nascita?"
    argomento_noto: true
    dipende_da: [DEC-CAM-CAMMINATA]
    presa: false
    fonte: "doc/CODA_2026-10-09.md::la camminata quantistica a moneta, punto 5"
    nota: >
      E- LA PROSSIMA, e il comando lo dice: `python csv/indice.py prossima`.
      La camminata conserva la NORMA esattamente, ma una quantita- usabile come
      ENERGIA non e- garantita -- e la decisione 10 (il calore paga la nascita) E-
      UN BILANCIO D-ENERGIA. Il contenuto sta nella voce
      DOMANDA-QUANTITA-CONSERVATA, col criterio di RIAPERTURA.

  - id: DEC-D6F-FORME-VUOTO
    etichetta: D6f
    titolo: "le TRE forme del vuoto locale: tipo, quanti per nodo, accoppiamento"
    argomento_noto: true
    dipende_da: [DEC-QC-CONSERVATA]
    presa: false
    fonte: "doc/CODA_2026-10-09.md::la camminata a moneta, punto 4"
    nota: >
      IL PRINCIPIO del vuoto locale e- PRESO (nodo D6); QUESTE SONO LE FORME, e
      restano aperte: (a) che cos-e- un grado di liberta- del vuoto (coppia
      coniugata / ampiezza complessa / stato interno della moneta); (b) quanti per
      nodo; (c) la forma dell-accoppiamento con la fase, DA DERIVARE (A1).
      ### Dipendono dalla QUANTITA- CONSERVATA, perche- l-accoppiamento sposta
      energia e senza una grandezza conservata non si scrive un bilancio.

  - id: DEC-FC-COESIONE
    etichetta: FC
    titolo: "la forza che tiene insieme il cluster, simmetrica fra le due bande"
    argomento_noto: true
    dipende_da: [DEC-QC-CONSERVATA]
    presa: false
    fonte: "doc/CODA_2026-10-09.md::la camminata a moneta, punto 2"
    nota: >
      Dalla voce MATERIA-ANTIMATERIA-SPAZIO: la forza che tiene il cluster deve
      agire ALLO STESSO MODO sulle due bande, e la sua FORMA e- da DERIVARE (A1).
      ### E una non linearita- A SEGNO FISSO e- attrattiva per UNA banda e
      repulsiva per l-altra: terrebbe la materia e DISFEREBBE l-antimateria PER
      COSTRUZIONE -- e il prototipo ne fa un BRACCIO CHE DEVE FALLIRE.

  - id: DEC-D9-GEOMETRIA
    etichetta: D9
    titolo: "come nasce la geometria: la topologia e la metrica"
    argomento_noto: true
    dipende_da: []
    presa: false
    fonte: "doc/CODA_2026-10-09.md::albero delle scelte, punto 2"
    nota: >
      LA DIREZIONE DICHIARATA DA LUCA (2026-10-09): <<lo spazio emerge grazie alla
      mitosi>> -- la mitosi crea i NODI e gli ARCHI (la topologia), le relazioni fra
      gli stati psi dei nodi ne danno la METRICA: e- la 9(b).
      ### MA IL MANDATO DICE, ALLA LETTERA, CHE LA DIREZIONE NON E- UNA DECISIONE
      PRESA: <<il confronto (a)/(b) su PROVA resta, con i criteri fissati PRIMA>>.
      ### Quindi `presa` e- false, e la direzione sta QUI come nota e non come stato.
      E- la prima cosa che questo albero serve a tenere separata.

  - id: DEC-D13-MEMORIE
    etichetta: D13
    titolo: "le memorie dentro H"
    argomento_noto: true
    dipende_da: [DEC-CAM-CAMMINATA]
    presa: false
    fonte: "doc/CODA_2026-10-09.md::albero delle scelte, punto 2"
    nota: >
      Cinque voci dell-era 1 sono SUPERATE da A16 con la nota <<idea da rileggere
      quando si scrivono le memorie dentro H, decisione 13>>: M-FLUSSO, M-ISTERESI,
      M-LEGAMI, M-MASSA, MEM-VERSO. ### Sono il materiale di questo nodo, e il mandato
      2 le ha marcate proprio per questo.

  - id: DEC-D6-VUOTO
    etichetta: D6
    titolo: "il vuoto"
    argomento_noto: true
    dipende_da: [DEC-CAM-CAMMINATA]
    presa: true
    fonte: "doc/CODA_2026-10-09.md::albero delle scelte, punto 2"

  - id: DEC-D7-DIVISIONE
    etichetta: D7
    titolo: "la divisione"
    argomento_noto: true
    dipende_da: [DEC-D6F-FORME-VUOTO, DEC-FC-COESIONE]
    presa: false
    fonte: "doc/CODA_2026-10-09.md::le sei decisioni del 2026-10-10, punto 1"
    nota: >
      DECISIONE DI LUCA, 2026-10-10 (da CANDIDATA a PRESA). Alla nascita
      psi -> psi/sqrt(2) per il padre E per il figlio, CON LA STESSA FASE.
      Conserva la somma di rho e DIMEZZA la somma di rho^2.
      ### MISURATO, e corregge la parola del mandato: la conservazione e-
      ESATTA IN ARITMETICA ESATTA, non AL BIT. Su 200000 spinori casuali
      (seme 11) la somma di rho coincide al bit nel 23.7% dei casi, con
      errore relativo massimo 9.4e-16, perche- (1/sqrt(2))^2 - 0.5 vale
      -1.11e-16: il quadrato del fattore NON e- esattamente un mezzo.
      Scalare rho per 0.5 sarebbe esatto al 100% (0.5 e 2 sono esatti in
      binario), ma si scala PSI, non rho. ### E la somma di rho^2 si
      dimezza con la stessa precisione: mediana 0.49999999999999983.
      ### Quindi la soglia giusta e- quella della NORMA (passi * eps), la
      stessa famiglia del punto medio implicito, e NON una soglia al bit.
      ### E CIO- CHE ERA GIA- SCRITTO RESTA VERO: la divisione ALZA H,
      quindi va PAGATA -- e- la decisione 10, PRESA in 3e8375b (il calore
      paga la nascita, e LA SOGLIA E- IL BILANCIO).
      ### ⛔ E QUI UNA DIFFERENZA DAL MANDATO, e L-ALBERO VINCE -- come Luca
      scrive tre volte: <<se l-albero dice altro, VINCE L-ALBERO e scrivi la
      differenza>>. Il mandato chiede di portare questa decisione a PRESA, ma
      D7 DIPENDE DA D6 (il vuoto), che NON e- preso -- e P-ALB rifiuta, perche-
      una decisione non si prende PRIMA di quelle da cui dipende. ### E il
      punto 6 DELLO STESSO MANDATO dice che il VUOTO LOCALE blocca la mitosi e
      PRECEDE D9: cioe- il mandato stesso mette il vuoto PRIMA. ### QUINDI il
      CONTENUTO della decisione e- registrato QUI, verificabile, e presa resta
      false finche- D6 non e- preso -- e D6 si prende nella voce 10 della coda
      (VUOTO-LOCALE-DETERMINISTICO da proposta a decisione di Luca). ### Non e-
      un rifiuto del mandato: e- l-ORDINE che il mandato stesso implica.
      ### ✅ AGGIORNAMENTO DEL 2026-10-10, dopo il RICABLAGGIO: D6 (il
      PRINCIPIO del vuoto) E- PRESO, ma D7 ora dipende da D6f (le FORME del
      vuoto) e da FC (la forza di coesione), e NESSUNA DELLE DUE e- presa.
      ### PROVATO, non asserito: marcando D7 presa, P-ALB risponde <<e-
      marcata PRESA e dipende da DEC-FC-COESIONE, che NON e- PRESA>>, e i
      byte dell-albero sono stati ripristinati (sha1 7ee0a029).
      ### QUINDI LA DIPENDENZA CHE MANCA E- LA QUANTITA- CONSERVATA: le forme
      del vuoto e la forza di coesione dipendono ENTRAMBE da QC, che e- LA
      PROSSIMA. Il PRINCIPIO della divisione resta preso e registrato; cio-
      che manca e- CHI PAGA, ed e- esattamente cio- che il mandato prevede.

  # ----------------------------------------------------------------------------------
  #  IL NODO DI METODO, il solo fuori dalla catena di cui il repo sappia l-argomento
  # ----------------------------------------------------------------------------------

  - id: DEC-INT-INTEGRATORE
    etichetta: INT
    titolo: "quale integratore: il GLOBALE o il LOCALE"
    argomento_noto: true
    dipende_da: []
    presa: true
    fonte: "doc/CODA_2026-10-09.md::le sei decisioni del 2026-10-10, punto 3"
    nota: >
      DECISIONE DI LUCA, 2026-10-10 (punto 3 delle sei): l-integratore e- il
      LOCALE A STRATI. ### LA RAGIONE E- MISURATA, non di gusto: il cono del
      LOCALE e- ESATTO, quello del GLOBALE DIPENDE DALLA TOLLERANZA -- cioe-
      NON E- UNA CAUSALITA- (il braccio sta in _collauda_passo.py, blocco C).
      ### E sulla REVERSIBILITA- i due sono UGUALI: b99bb4c dice che entrambi
      tornano a 4e-16. ### Quindi il discrimine NON e- la precisione: e- la
      CAUSALITA-.
      ### IL GLOBALE RESTA NEL CODICE, solo come TERMINE DI CONFRONTO dei
      collaudi, e la configurazione NON PUO- SCEGLIERLO per una corsa di
      fisica: dal 2026-10-10 `integratore: globale` senza `confronto: true`
      viene RIFIUTATO dallo schema della configurazione. Collaudo da 25 a 28.
      ### ⚠ E QUESTA DECISIONE E- POI STATA SUPERATA, LO STESSO GIORNO: il
      mandato della CAMMINATA QUANTISTICA A MONETA (voce 10 della coda, nella
      sua SECONDA versione) dice <<l-integratore a strati: SUPERATO da questa
      decisione>>, perche- nella camminata lo spostamento aggiorna TUTTI gli
      archi INSIEME e l-anisotropia dell-ordine degli strati sparisce per
      costruzione (A17: l-ordine di esecuzione non e- fisica).
      ### Lo scrivo QUI e non lo applico QUI: la voce 10 viene DOPO nella coda,
      e applicare una decisione prima del suo turno nasconderebbe l-ordine.
      ### La prima versione di quel mandato diceva il CONTRARIO (<<resta il
      locale a strati, non riaprirla>>): la differenza e- scritta nella coda.
      ### ✅ E DAL 2026-10-10 IL SUPERAMENTO E- FORMALE: la voce che supera
      questa decisione e- `CAMMINATA-A-MONETA`. ### ⚠ `decisioni.jsonl` NON
      HA un campo `superata_da` -- i suoi campi sono argomento_noto, data,
      dipende_da, etichetta, fonte, id, nome_scheda, presa, titolo -- quindi il
      legame vive QUI, nella nota, e NON e- leggibile da un programma.
      ### Se servisse a un programma, servirebbe un CAMPO (par. 9): lo dico
      invece di far finta che il legame sia strutturato.
      --- la nota di prima:
      L-ARGOMENTO LO DICE IL MANDATO: <<un secondo integratore come CANDIDATO, non
      come scelta (la decide Luca: nodo INT del piano)>>.
      ### E LE DUE ALTERNATIVE SONO GIA- MISURATE, cosa che nessun altro nodo ha:
      il LOCALE ha un cono ESATTO (1 arco per strato, 3 archi per passo, esattamente
      zero oltre); il GLOBALE ne ha 5, E IL SUO RAGGIO DIPENDE DALLA TOLLERANZA
      (3 archi a 1e-4, 5 a 1e-8 e a 1e-14) -- quindi il suo orizzonte e- un ARTEFATTO
      DEL SOLUTORE, non causalita-. Deriva di norma 1.191e-15 (globale) contro
      1.986e-15 (locale); energia 3.9e-5 per entrambi; reversibilita- 4e-15 per
      entrambi, e la differenza fra i due E- RUMORE DI ARROTONDAMENTO (su 4 semi il
      rapporto oscilla di un fattore 3.7, e tutti gli 8 valori stanno al pavimento
      del float64).
      ### IL REFERTO MISURA LE ALTERNATIVE E NON SCEGLIE: e- la forma dell-albero
      applicata a una decisione di metodo.

  # ----------------------------------------------------------------------------------
  #  I CINQUE NODI DI CUI IL REPO NON DICE L-ARGOMENTO
  #  ### Il mandato li elenca -- <<piu- D4, D2, D11, D12, T4>> -- e NON dice di che
  #  ### cosa decidano. La lista numerata delle decisioni di Luca NON E- NEL REPO:
  #  ### cercata in CODA_2026-10-09.md, PUNTO_DELLA_SITUAZIONE.md, nella relazione,
  #  ### nei task history e nell-indice.
  #  ### NON INVENTO il loro argomento. Il nodo esiste, l-etichetta e- quella di Luca,
  #  ### e `argomento_noto: false` PORTA UNA DOMANDA: il presidio pretende che un nodo
  #  ### cosi- NON sia `presa`, perche- NON SI PUO- PRENDERE UNA DECISIONE DI CUI NON
  #  ### SI SA L-ARGOMENTO.
  # ----------------------------------------------------------------------------------

  - id: DEC-D2-DA-CHIEDERE
    etichetta: D2
    titolo: "l-interferenza NORMALIZZATA sul grado, o no"
    argomento_noto: true
    dipende_da: []
    presa: false
    fonte: "doc/CODA_2026-10-09.md::albero delle scelte, punto 2"
    nota: >
      DECISIONE DI LUCA, 2026-10-10 (punto 5 delle sei): l-argomento c-era, e
      sta nella tabella delle 13 di doc/TRADUZIONE_IN_H.md -- VERIFICATO
      ALLA LETTERA sul repo. ### LE DUE VIE: `w_ij` COME OGGI, oppure
      `w_ij/sqrt(s_i s_j)`. ### IL NUMERO CHE LA RENDE UNA DECISIONE: il PR
      del Perron a g = 0 passa da 24.6 a 348.2 su 400 -- cioe- LA GEOMETRIA
      DA SOLA CONCENTRA, e la normalizzazione glielo toglie quasi tutto.
      ### E TOCCA `A3`: `s_k` e- del proprio intorno, ma e- una SOMMA e non
      una statistica di posizione (`s~_k` da 0.3856 a 0.1160 di deviazione,
      media 0.98 e NON 1).

  - id: DEC-D4-DA-CHIEDERE
    etichetta: D4
    titolo: "`A` da phi0 congelata o dalla MEMORIA VIVA dei legami"
    argomento_noto: true
    dipende_da: []
    presa: false
    fonte: "doc/CODA_2026-10-09.md::albero delle scelte, punto 2"
    nota: >
      DECISIONE DI LUCA, 2026-10-10 (punto 5 delle sei): l-argomento sta
      nella tabella delle 13, VERIFICATO sul repo. ### LE DUE VIE: `phi0`
      CONGELATA (come oggi), oppure UNA MEMORIA D-ARCO CHE EVOLVE.
      ### E NON E- NEUTRA: `phi0` congelata VIOLA `A15.1` (non dimentica
      niente) ed e- la voce `PHI0-CONGELATA`. Con la memoria viva `A`
      diventa un grado di liberta- DENTRO `H` (`A16.3`), e la `H` candidata
      acquista un termine.

  - id: DEC-D11-DA-CHIEDERE
    etichetta: D11
    titolo: "la forma U(2) della coppia: tenerla o no"
    argomento_noto: true
    dipende_da: []
    presa: false
    fonte: "doc/CODA_2026-10-09.md::albero delle scelte, punto 2"
    nota: >
      DECISIONE DI LUCA, 2026-10-10 (punto 5 delle sei): l-argomento sta
      nella tabella delle 13, VERIFICATO sul repo. ### E LA TABELLA DICE LA
      COSA PIU- IMPORTANTE: <<NON e- una traduzione: e- UNA LEGGE NUOVA>> --
      1.054 di scarto, il 105 per cento, DIECI VOLTE sopra la soglia del 10
      per cento. ### Va decisa COME FISICA NUOVA, non adottata come
      riscrittura: e- la differenza fra tradurre e inventare.

  - id: DEC-D12-DA-CHIEDERE
    etichetta: D12
    titolo: "la SCOMPARSA degli archi: tenerla o vietarla"
    argomento_noto: true
    dipende_da: []
    presa: false
    fonte: "doc/CODA_2026-10-09.md::albero delle scelte, punto 2"
    nota: >
      DECISIONE DI LUCA, 2026-10-10 (punto 5 delle sei): l-argomento sta
      nella tabella delle 13, VERIFICATO sul repo. ### E LA TENSIONE CON
      `A14.2` E- IL PUNTO: l-assioma dice che LA CRESCITA E- L-UNICA FRECCIA
      AMMESSA, quindi un arco che muore e- GIA- UNA VIOLAZIONE.
      ### <<Non e- una legge da tradurre: e- un DIFETTO da decidere>>, e la
      frase e- della tabella, non mia.

  - id: DEC-T4-DA-CHIEDERE
    etichetta: T4
    titolo: "le cure dei siti che leggono pos"
    argomento_noto: true
    dipende_da: []
    presa: false
    fonte: "doc/CODA_2026-10-09.md::albero delle scelte, punto 2"
    nota: >
      DECISIONE DI LUCA, 2026-10-10 (punto 5 delle sei): l-argomento viene
      dal PIANO DELLO SCHEDULATORE, 8455a16 -- VERIFICATO: quel commit dice
      <<SCHEDULATORE DEL PASSO: analisi e piano. 57 funzioni tipizzate, 11
      letture di pos>>. ### E il censimento successivo (a34cc48) dice 14
      leggi su 20 che leggono pos, di cui 9 sono IL CENTRO DI MASSA della
      sincronizzazione -- che la decisione 3 ha TOLTO (3e8375b).
      ### Quindi il nodo decide COME SI CURANO i siti che restano, e `A17`
      ne fa un obbligo per costruzione nell-era 2.

# ====================================================================================
#  LE RADICI GIA- PRESE
#  ### Il mandato dice: <<Gia- prese, come radici: A16, A17, le decisioni 1, 3, 10>>.
#  ### A16 e A17 CI SONO, come DEC-A16 e DEC-A17 (li genera il generatore dagli
#  ### assiomi). ### <<Le decisioni 1, 3, 10>> appartengono alla STESSA LISTA NUMERATA
#  ### CHE NON E- NEL REPO: non le indovino, e la domanda e- la stessa dei cinque nodi
#  ### sopra.
# ====================================================================================

radici_prese:
  - DEC-A16
  - DEC-A17
