# ====================================================================================
#  LA MAPPA DELLE DIPENDENZE -- punto 11(b)
# ------------------------------------------------------------------------------------
#  ### CHI IMPORTA CHI, DICHIARATO. Un import fuori mappa, un CICLO, o un modulo che
#  ### non e' in mappa -> RIFIUTATO.
#
#  ### PERCHE' UNA MAPPA E NON SOLO UN DIVIETO: P-E4 vieta DUE import (osservatori/,
#  ### driver) perche' lo strumento non e' fisica. Una mappa dice invece la COSA
#  ### POSITIVA -- cio' che e' PREVISTO -- e un import che nessuno ha previsto e'
#  ### esattamente quello che degrada la modularita' senza che nessuno lo decida.
#
#  ### E OGNI MODULO DICHIARA LA SUA RESPONSABILITA' IN UNA RIGA (punto 11(d)): se non
#  ### si riesce a scriverla in una riga, IL MODULO FA DUE COSE.
#
#  ### IL TETTO DI RIGHE (punto 11(c)): oltre, SI DIVIDE, NON SI ALLUNGA. I generati
#  ### non hanno tetto -- la loro lunghezza la decide la tabella, non chi scrive.
# ====================================================================================
versione: 1

# ### IL TETTO, per i file NON generati. Misurato il 2026-10-10: il piu' lungo e'
# ### _genera.py con 684 righe, e il tetto e' 700 -- ### DICHIARATO SUL MISURATO, non
# ### scelto a caso, e la regola e' che oltre SI DIVIDE.
tetto_righe: 700

moduli:

  # ------------------------------------------------------------------ LA FISICA
  - nome: stato.py
    responsabilita: lo stato, generato dalla tabella, e i suoi domini
    generato: true
    importa: []

  - nome: hamiltoniana.py
    responsabilita: somma i termini di H e il loro gradiente, in ordine canonico
    importa: []

  - nome: passo.py
    responsabilita: lo schedulatore a strati e i due integratori candidati
    importa: [grafo, hamiltoniana, stato]

  - nome: grafo.py
    responsabilita: la validita- del grafo, controllata A OGNI PASSO (punto 4)
    importa: []

  - nome: determinismo.py
    responsabilita: RNG col seme, thread a uno, versioni bloccate (punto 1)
    importa: []

  - nome: simmetrie.py
    responsabilita: le simmetrie simboliche e le soglie DERIVATE delle conservazioni
    importa: []

  - nome: collauda.py
    responsabilita: un solo comando per tutti i collaudi, coi TEMPI e il budget
    importa: [_presidio]

  - nome: _collauda_guida.py
    responsabilita: ESEGUE la guida passo per passo, su una legge di prova
    importa: []

  - nome: _collauda_simmetrie.py
    responsabilita: il collaudo delle simmetrie e delle conservazioni misurate
    importa: [driver, hamiltoniana, passo, schema_config, simmetrie, stato]

  - nome: _collauda_determinismo.py
    responsabilita: il collaudo del determinismo, e i due processi byte-identici
    importa: [determinismo, schema_config]

  - nome: _collauda_scala.py
    responsabilita: l invarianza di scala -- al bit per le potenze di due, e la controprova con la scala del vuoto
    importa: [_presidio, deriva, flussi_parziali, tick]

  - nome: _collauda_schema_camminata.py
    responsabilita: il collaudo dello schema della camminata, nei DUE VERSI
    importa: [_presidio, schema]

  - nome: _collauda_grafo.py
    responsabilita: il collaudo del grafo, e i cinque casi che devono fallire
    importa: [driver, grafo, passo, schema_config, stato]

  - nome: _collauda_genera.py
    responsabilita: il collaudo del generatore, e il ramo end-to-end delle dimensioni
    importa: [_genera, _presidio]

  - nome: incidenza.py
    responsabilita: la struttura compatta delle estremita- d-arco, e il suo punto unico
    importa: [_presidio, grafo]

  - nome: _collauda_incidenza.py
    responsabilita: il collaudo della struttura compatta, e i sette casi che devono fallire
    importa: [_presidio, incidenza]

  - nome: materia_vuoto.py
    responsabilita: il generatore dell accoppiamento materia-vuoto, il flusso esatto e il limite rho uguale a zero
    importa: [flussi_parziali]

  - nome: saturazione.py
    responsabilita: le quattro funzioni del generatore della saturazione, e il LIMITE
    importa: []

  - nome: scena_l2.py
    responsabilita: la scena di riferimento di L2 -- n geometrici, U uno, vuoto uniforme
    importa: [corrente, incidenza, motore, stato]

  - nome: _misura_forme_l2.py
    responsabilita: le quattro forme misurate con rho come sorgente, e il cono nei due modi
    importa: [_presidio, deriva, flussi_parziali, scena_l2, tick]

  - nome: statica_protocollo.py
    responsabilita: lo strumento della risposta statica -- scena, rampa, congelamento, passo e barre a blocchi
    importa: [_misura_forme_l2, composizione, deriva, flussi_parziali, motore, scena_l2, tick]

  - nome: _misura_completa_l2.py
    responsabilita: le tre misure del punto A -- cono, divergenza e simmetria su stati
    importa: [_presidio, corrente, _misura_theta_n, _misura_theta_nonlineare, statica_protocollo]

  - nome: _misura_statica_motore.py
    responsabilita: la risposta statica con la legge NEL MOTORE, e il confronto con S3 di ebf5317
    importa: [_presidio, statica_protocollo]

  - nome: _misura_statica_l2.py
    responsabilita: le MISURE della risposta statica -- i bracci, i verdetti e il confronto fra i due metodi
    importa: [_presidio, composizione, scena_l2, statica_protocollo]

  - nome: _deriva_forme_l2.py
    responsabilita: la derivazione simbolica delle quattro forme e del prezzo della linearita
    importa: [_presidio]

  - nome: _misura_pari_l2.py
    responsabilita: la parte pari di dLambda -- il verso con la barra, e l-esponente in x
    importa: [_presidio, deriva, saturazione, scena_l2, tick]

  - nome: _misura_verso_l2.py
    responsabilita: se la materia consuma il vuoto, e se il verso viene dal segno di beta
    importa: [_presidio, deriva, saturazione, scena_l2, tick]

  - nome: _misura_theta_nonlineare.py
    responsabilita: la simmetria P Theta sul passo INTERO col termine non lineare, e la C sul flusso nuovo
    importa: [_misura_c_flussi, _misura_theta_n, _presidio, composizione, corrente, deriva, flussi_parziali, motore, tick]

  - nome: _misura_theta_n.py
    responsabilita: se Theta e le direzioni n danno una simmetria esatta del passo
    importa: [_presidio, composizione, corrente, deriva, incidenza, motore, stato, tick]

  - nome: _misura_spettro_l1.py
    responsabilita: lo spettro del passo lineare palindromo, e dove la C si rovescia
    importa: [_presidio, composizione, corrente, deriva, incidenza, motore, stato, tick]

  - nome: _misura_mb2.py
    responsabilita: l-errore di conservazione di H_tot contro dtau, a tempo totale fisso
    importa: [_presidio, deriva, tick]

  - nome: _misura_c_flussi.py
    responsabilita: dove la C si rompe coi flussi parziali, e che cosa la riparerebbe
    importa: [_presidio, deriva]

  - nome: _misura_costo_motore.py
    responsabilita: il costo del motore e le allocazioni per tick -- misurati, non stimati
    importa: [_presidio, incidenza, motore, stato]

  - nome: _collauda_cs_l1.py
    responsabilita: i quattro criteri con cui L1 e- chiuso, rigirati con la forma cs ACCESA
    importa: [_collauda_tempo_proprio, _misura_completa_l2, _misura_mb2, _misura_theta_n, _misura_theta_nonlineare, _presidio, composizione, corrente, deriva, flussi_parziali, tick]

  - nome: _misura_mb1.py
    responsabilita: il raccordo al bit pezzo per pezzo contro il commit di riferimento
    importa: [_censimento_strumenti, _presidio, composizione, deriva, tick]

  - nome: _censimento_strumenti.py
    responsabilita: chi, fra gli strumenti, materializza un albero vecchio o scrive nel repo
    importa: []

  - nome: flussi_parziali.py
    responsabilita: il tempo proprio locale, la fase esatta, e i due flussi parziali
    importa: []

  - nome: motore.py
    responsabilita: il doppio contenitore, i pezzi unitari, il flusso, e la regola del tick
    importa: [flussi_parziali, incidenza, materia_vuoto, saturazione]

  - nome: _collauda_motore.py
    responsabilita: il collaudo del motore -- zero allocazioni, unitarieta-, regola del tick
    importa: [_presidio, incidenza, motore, stato]

  - nome: checkpoint.py
    responsabilita: salva e riprende stato, grafo, geometria e contatori, e il timbro
    importa: [_presidio, incidenza, motore, stato, timbro]

  - nome: _collauda_checkpoint.py
    responsabilita: il collaudo della ripresa -- coincide AL BIT, e i cinque casi che falliscono
    importa: [_presidio, checkpoint, incidenza, motore, stato, timbro]

  - nome: _collauda_memoria.py
    responsabilita: i quattro collaudi della memoria, e sono l-accettazione del pezzo 5
    importa: [_presidio, incidenza, motore, stato, timbro]

  - nome: _collauda_confronto.py
    responsabilita: il confronto tabella/banco ESEGUIBILE, e i cinque casi che falliscono
    importa: [_presidio]

  - nome: _collauda_materia_vuoto.py
    responsabilita: il flusso di CAMM-MATERIA-VUOTO -- esatto, il limite rho zero, e l Eulero che DEVE fallire
    importa: [_presidio, flussi_parziali, incidenza, materia_vuoto, motore, stato]

  - nome: _collauda_saturazione.py
    responsabilita: il collaudo del flusso di saturazione, e la causa della sua esattezza
    importa: [_presidio, incidenza, motore, saturazione, stato]

  - nome: energia.py
    responsabilita: E come somma di densita- locali, la corrente sugli archi e il bilancio
    importa: [materia_vuoto]

  - nome: _collauda_energia.py
    responsabilita: il collaudo di E e del bilancio, e il fallimento affermato come fatto
    importa: [_presidio, energia, incidenza, motore, stato]

  - nome: corrente.py
    responsabilita: la corrente locale di E, costruita dalla forma quadratica, e la portata
    importa: [_presidio, energia, incidenza, motore, stato]

  - nome: _collauda_corrente.py
    responsabilita: il collaudo della corrente locale, e i tre casi che devono fallire
    importa: [_presidio, corrente]

  - nome: deriva.py
    responsabilita: la deriva di E e dei suoi due termini, la scansione in x, e la sorgente
    importa: [_presidio, composizione, corrente, deriva_referto, deriva_serie, deriva_variabile, energia, incidenza, motore, stato, tick]

  - nome: deriva_variabile.py
    responsabilita: la variabile del flusso che gira, letta dalla tabella
    importa: [composizione, motore]

  - nome: deriva_serie.py
    responsabilita: le statistiche PURE sulle serie -- nessuna scena, nessun motore
    importa: []

  - nome: deriva_referto.py
    responsabilita: il referto della deriva, e la configurazione INTERA che dichiara
    importa: []

  - nome: bande.py
    responsabilita: le due bande spettrali di W, il controllo C, e le grandezze per banda
    importa: [_presidio, composizione, deriva, deriva_variabile, energia, motore, tick]

  - nome: bande_floquet.py
    responsabilita: il riscaldamento di Floquet sulla scena grande, e il salvataggio durante la corsa
    importa: [_presidio, bande, composizione, corrente, deriva, deriva_variabile, incidenza, motore, stato, tick]

  - nome: segno.py
    responsabilita: lo squilibrio LOCALE q, C-dispari, e la sua validazione contro Q
    importa: [_presidio, bande, bande_floquet, composizione, corrente, deriva, deriva_variabile, motore, tick]

  - nome: _collauda_tempo_proprio.py
    responsabilita: misura quali pezzi evolvono col TICK invece che col tempo proprio
    importa: [_presidio, composizione, deriva, flussi_parziali, tick]

  - nome: _collauda_cs.py
    responsabilita: il collaudo della forma cs -- la forma spenta e' il passo di oggi al bit
    importa: [_presidio, checkpoint, deriva, flussi_parziali, incidenza, motore, schema_config, stato, tick]

  - nome: _collauda_cs_centro.py
    responsabilita: cs al centro del palindromo a punto fisso -- i giri e il secondo ordine
    importa: [_presidio, composizione, deriva, flussi_parziali, tick]

  - nome: _collauda_deriva.py
    responsabilita: il collaudo della deriva, e presidia il FALSO-ZERO del termine spento
    importa: [_presidio, composizione, deriva, deriva_variabile, energia, materia_vuoto, motore, saturazione, tick]

  - nome: crescita.py
    responsabilita: la crescita del grafo, regola NON-H col suo bilancio
    importa: []

  - nome: vuoto.py
    responsabilita: lo scambio col vuoto, regola NON-H col suo bilancio
    importa: []

  - nome: _genera_camminata.py
    responsabilita: gli emettitori della camminata -- i legami e l-ordine
    importa: []

  - nome: composizione.py
    responsabilita: l-ordine di composizione, generato dalla tabella
    generato: true
    importa: []

  - nome: termini/camm_moneta_spin.py
    responsabilita: la moneta di spin, generata -- legame
    generato: true
    importa: []

  - nome: termini/camm_grover.py
    responsabilita: il Grover dello spinore, generato -- legame
    generato: true
    importa: []

  - nome: termini/camm_spostamento.py
    responsabilita: lo spostamento con trasporto, generato -- legame
    generato: true
    importa: []

  - nome: termini/camm_grover_vuoto.py
    responsabilita: il Grover del vuoto, generato -- legame
    generato: true
    importa: []

  - nome: termini/camm_spostamento_vuoto.py
    responsabilita: lo spostamento del vuoto, generato -- legame
    generato: true
    importa: []

  - nome: termini/camm_materia_vuoto.py
    responsabilita: l accoppiamento materia-vuoto, generato -- flusso esatto
    generato: true
    importa: []

  - nome: termini/camm_saturazione.py
    responsabilita: la saturazione, generata -- flusso esatto
    generato: true
    importa: []

  - nome: termini/camm_forma_d.py
    responsabilita: la forma (D), generata -- flusso SPENTO
    generato: true
    importa: []

  - nome: termini/prova_hopping.py
    responsabilita: il salto d-arco, generato -- PROVA
    generato: true
    importa: []

  - nome: termini/prova_locale.py
    responsabilita: il termine locale, generato -- PROVA
    generato: true
    importa: []

  # ------------------------------------------------------------------ GLI STRUMENTI
  - nome: osservatori/prova_norma.py
    responsabilita: la norma totale, generato -- osservatore in sola lettura
    generato: true
    importa: [_rif]

  - nome: _rif.py
    responsabilita: il costrutto @rif, byte-inerte, e il vocabolario dei ruoli
    importa: [_presidio]

  - nome: tick.py
    responsabilita: il passo della camminata -- un tick nell ordine della tabella, e la mappa legge-operatore
    importa: [composizione, flussi_parziali]

  - nome: timbro.py
    responsabilita: l-impronta di cio- che ha girato, e la ripresa che rifiuta
    importa: [determinismo]

  - nome: driver.py
    responsabilita: fa girare una configurazione, e non decide niente
    importa: [_presidio, determinismo, hamiltoniana, passo, schema_config, stato, timbro]

  # ------------------------------------------------------------------ IL GENERATORE
  - nome: leggi/schema.py
    responsabilita: la forma di una riga di tabella, e i divieti
    importa: [schema_camminata, simmetrie]

  - nome: leggi/schema_camminata.py
    responsabilita: cio- che la camminata aggiunge allo schema
    importa: []

  - nome: leggi/_collauda_schema.py
    responsabilita: il collaudo dello schema, nei due versi, in memoria
    importa: [_presidio, schema]

  - nome: _genera.py
    responsabilita: dalla tabella al modulo e alla scheda, passando dalla derivata
    importa: [_genera_stato, _presidio, _rif, schema, _genera_camminata]

  - nome: _genera_stato.py
    responsabilita: il sorgente di stato.py, dalle variabili della tabella
    importa: [schema]

  - nome: config/schema_config.py
    responsabilita: la forma di una configurazione, e nessun campo facoltativo
    importa: [_presidio]

  # ------------------------------------------------------------------ IL COLLAUDO
  - nome: _collauda_passo.py
    responsabilita: il collaudo della catena, e i casi che devono fallire
    importa: [_genera, _presidio, hamiltoniana, passo, schema, schema_config, stato]

  # ------------------------------------------------------------------ I PACCHETTI
  # ------------------------------------------------------------------ I SIGILLI
  - nome: sigilli/__init__.py
    responsabilita: il pacchetto dei sigilli, che dichiarano LEGGE e CRITERI
    importa: []

  - nome: sigilli/_modello.py
    responsabilita: il modello di un sigillo di legge, coi quattro bracci del rito
    importa: [_presidio, hamiltoniana, passo, schema_config, stato, timbro]

  - nome: __init__.py
    responsabilita: il pacchetto dell-era 2, e cosa sta dove
    importa: []

  - nome: config/__init__.py
    responsabilita: il pacchetto delle configurazioni
    importa: []

  - nome: termini/__init__.py
    responsabilita: il pacchetto dei termini generati
    importa: []

  - nome: osservatori/__init__.py
    responsabilita: il pacchetto degli osservatori generati
    importa: []
