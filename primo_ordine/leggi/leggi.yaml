# ====================================================================================
#  LA TABELLA DELLE LEGGI -- L-UNICA FONTE
# ------------------------------------------------------------------------------------
#  Il codice e la scheda SI GENERANO da qui (primo_ordine/_genera.py). La macchina
#  verifica che legge <-> file <-> voce dell-indice <-> scheda siano IN BIIEZIONE.
#
#  NIENTE SI SCRIVE A MANO SOTTO primo_ordine/termini/: si scrive QUI, e SI GENERA.
#  Lo schema che valida questa tabella: primo_ordine/leggi/schema.py (25/25).
# ====================================================================================
#
#  IL FORMATO DI UNA LEGGE
#  -----------------------
#    id            [A-Z][A-Z0-9-]{3,}  -- almeno 4 caratteri
#    tipo          termine_nodo | termine_arco | regola | osservatore
#    prova         true/false  -- SE LA LEGGE E- FINTA. Le due di oggi sono true.
#    scheda        il testo da cui si genera doc/leggi_era2/<id>.md
#    assiomi       la lista degli assiomi soddisfatti (anche vuota, e allora LO DICE)
#
#  per un TERMINE (entra in H):
#    espressione   stringa simbolica (sympy)
#    ambito        le variabili che PUO- leggere. ### UN termine_nodo NON PUO- avere
#                  una variabile d-ARCO: leggerla E- VEDERE IL VICINO.
#    parametri     ognuno con VALORE, ORIGINE e DIMENSIONE. ### A1: la legge, NON il
#                  numero -- e un numero senza origine E- UNA MANOPOLA, uno senza
#                  dimensione e- un numero DI CUI NON SI SA CHE COSA SIA.
#
#  LE DIMENSIONI (punto 2 della terza parte)
#  -----------------------------------------
#    dimensione    E^<intero>, su OGNI variabile e OGNI parametro.
#    ### UNA SOLA BASE, E, e non e- una scelta di unita-: A16 dice che lo stato evolve
#    ### al primo ordine sotto una sola H, cioe- hbar = 1 -- e con hbar = 1 IL TEMPO E-
#    ### E^-1, non una dimensione indipendente. Una base in piu- sarebbe una manopola.
#    ### E LA DIMENSIONE STA SULLA VARIABILE, NON SUL TIPO -- al contrario del DOMINIO:
#    ### due variabili dello stesso tipo hanno lo stesso dominio PER COSTRUZIONE, ma
#    ### due reale_nodo possono essere UN-ENERGIA E UN TEMPO.
#    ### CHE COSA SI PRETENDE: (1) ogni ADDENDO ha la stessa dimensione (sommare
#    ### un-energia e un-energia al quadrato non e- un errore di battitura: e- un-altra
#    ### fisica); (2) un TERMINE, che entra in H, ha dimensione E^1; (3) un
#    ### OSSERVATORE dichiara la SUA e deve essere omogeneo -- pretendere E^1 da tutti
#    ### VIETEREBBE DI MISURARE LA NORMA, che e- E^0.
#
#  per una REGOLA (NON entra in H):
#    ingressi, uscite, bilancio   ### CIO- CHE ESCE DA H DEVE ANDARE DA QUALCHE PARTE.
#                  Senza il campo `bilancio` la regola NON SI SCRIVE.
#
#  I TIPI DI VARIABILE AMMESSI
#  ---------------------------
#    complesso_c2_nodo   psi, C^2 sul NODO (A16)
#    reale_nodo          un reale sul nodo
#    reale_arco          un reale sull-arco
#    fase_arco           una fase sull-arco
#    coppia_coniugata    (q, p)  ### AMMESSA E NON USATA: e- la decisione 13, APERTA
#
#  ### E NON C-E- NIENTE PER LA POSIZIONE: e- la decisione 9, APERTA, e A17 vieta che
#  ### una posizione entri nella fisica. Il simbolo `pos` (e x, y, z, coord) e- VIETATO,
#  ### e il generatore RIFIUTA l-espressione che lo nomina.
#  ### ⭐ IL FORMATO NON PUO- ESPRIMERE UNA GEOMETRIA, QUINDI NON NE SCEGLIE UNA.
# ====================================================================================
versione: 1

# ### LE VARIABILI DI STATO: il vocabolario che l-ambito delle leggi puo- nominare.
#     Ognuna ha una VOCE in doc/indice/variabili.jsonl (`P-E3` lo verifica in biiezione).
variabili:
  - nome: psi
    tipo: complesso_c2_nodo
    voce: V-PSI-ERA2
    # ### psi e- ADIMENSIONALE: psi^dag psi e- LA NORMA, cioe- un CONTEGGIO. ### E con
    # ### hbar = 1 (che e- cio- che A16 implica) il tempo e- E^-1, quindi la sola base
    # ### dimensionale e- E.
    dimensione: E^0
    scheda: >-
      Lo spinore di nodo, C^2. `A16`: lo spinore E' il tempo proprio della massa, e vive
      SUL NODO. I suoi simboli, per il generatore, sono `psi_0` e `psi_1` piu' i
      CONIUGATI INDIPENDENTI `psi_0c` e `psi_1c` -- indipendenti perche' la derivata che
      serve e' quella di WIRTINGER.

  # ==================================================================================
  #  LE VARIABILI DELLA CAMMINATA -- sulle ESTREMITA' D'ARCO
  # ----------------------------------------------------------------------------------
  #  ### I NOMI PORTANO IL SUFFISSO `_h`, e NON e' una decorazione: `h` e' l'indice di
  #  ### ESTREMITA' che il banco usa in ogni riga (`psi[h]`, `partner[h]`, `nodo[h]`),
  #  ### quindi il nome dice DOVE VIVE la variabile.
  #  ### ⚠ E CONVIVONO CON `psi`, che e' lo spinore DI NODO delle leggi di PROVA: quelle
  #  ### servono a collaudare la catena del formalismo di `H`, e quando andranno via
  #  ### ANDRA' VIA ANCHE `psi`. Due spinori nella stessa tabella sono un fatto
  #  ### TRANSITORIO, e sta scritto qui invece di essere scoperto dopo.
  # ==================================================================================
  - nome: psi_h
    tipo: complesso_c2_estremita
    voce: V-PSI-H-ERA2
    dimensione: E^0
    scheda: >-
      Lo spinore della camminata, `C^2` SULL'ESTREMITA' D'ARCO (punto `F1` della carta
      della fisica). E' ADIMENSIONALE perche' `psi^dag psi` e' LA NORMA, cioe' un
      CONTEGGIO. ### Vive sull'estremita' e NON sul nodo, e il punto `F1` lo DECIDE:
      un'estremita' porta uno spinore, un nodo ne porta tanti quanto il suo grado.
  - nome: phi_h
    tipo: reale_estremita
    voce: V-PHI-H-ERA2
    dimensione: E^0
    scheda: >-
      Il vuoto locale, uno SCALARE NEUTRO sull'estremita' d'arco (punto `F4`). E'
      l'erede dello scuotimento dell'era `1`: deterministico, col caso SOLO nelle
      condizioni iniziali e da un seme. ### E' NEUTRO, quindi lo spostamento lo porta
      SENZA `U` -- ed e' la differenza che lo distingue da `psi_h`.
  - nome: Lambda
    tipo: reale_nodo
    voce: V-LAMBDA-ERA2
    dimensione: E^0
    scheda: >-
      La densita' locale del vuoto nel nodo, `Lambda_k = somma |phi_h|^2` sulle
      estremita' del nodo (punto `F4`). ### E' LA SCALA RISPETTO A CUI LA SATURAZIONE
      SI MISURA (punto `F5`), ed e' per questo che non serve nessuna costante `g`: la
      scala e' RELAZIONALE, cioe' presa dal sistema e non messa a mano.
  - nome: h_int
    tipo: reale_nodo
    voce: V-H-INT-ERA2
    dimensione: E^0
    scheda: >-
      L'elicita' del nodo, cioe' il campo di interferenza da cui nasce la saturazione
      (punti `F5` e `F6`). ### E' DISPARI SOTTO `C` (punto `F3`), e questo la rende la
      grandezza da cui si legge MATERIA o ANTIMATERIA.

# ### ⚠ **E L-ORDINE STA QUI, PRIMA DELLE LEGGI, PER UNA RAGIONE PRATICA E DICHIARATA:
#     la GUIDA documenta che una legge nuova SI AGGIUNGE IN CODA AL FILE, e il suo
#     collaudo lo FA. ### Con l-ordine in fondo, <<aggiungere in coda>> metteva la
#     legge SOTTO la chiave `ordine`, e la tabella non era piu- leggibile.
#     ### ✅ Spostarlo qui tiene vivo un modo di lavorare CHE LA GUIDA PROMETTE,
#     invece di cambiare la promessa.
# ====================================================================================
#  L-ORDINE DI COMPOSIZIONE -- UNA LISTA, e le ripetizioni sono AMMESSE
# ------------------------------------------------------------------------------------
#  ### ⭐ E- UNA LISTA, e il posto `P2` del piano si e- CHIUSO su questo argomento
#  ### (del guardiano, 2026-10-12): la composizione di Strang usa LO STESSO PEZZO DUE
#  ### VOLTE -- mezzo flusso, passo lineare, mezzo flusso -- e UN CAMPO PER PEZZO NON
#  ### PUO- ESPRIMERE un pezzo che compare due volte, perche- vorrebbe due valori nello
#  ### stesso campo. Una lista ammette ripetizioni.
#  ### ⛔ E OGNI ELEMENTO PORTA LA SUA FRAZIONE DI PASSO: senza la frazione la lista
#  ### direbbe l-ORDINE e non il PASSO.
#  ### ⭐ E IL CONTROLLO CHE VALE PIU- DI TUTTI: la somma delle frazioni di una legge
#  ### deve fare 1 ESATTO. Una composizione dove le due meta- fanno 0.9 NON INTEGRA IL
#  ### PASSO INTERO, e non e- uno stile: e- un PASSO SBAGLIATO.
#  ### ⚠ E `CAMM-FORMA-D` NON C-E-, ed e- il punto: una legge DICHIARATA SPENTA sta
#  ### in tabella e NON nell-ordine. Il suo posto esiste, il suo effetto no.
# ====================================================================================
ordine:
  - {legge: CAMM-SATURAZIONE, frazione: 0.5}
  - {legge: CAMM-MONETA-SPIN, frazione: 1}
  - {legge: CAMM-GROVER, frazione: 1}
  - {legge: CAMM-SPOSTAMENTO, frazione: 1}
  - {legge: CAMM-GROVER-VUOTO, frazione: 1}
  - {legge: CAMM-SPOSTAMENTO-VUOTO, frazione: 1}
  - {legge: CAMM-SATURAZIONE, frazione: 0.5}

# ### LE LEGGI. Sono DUE, ed ENTRAMBE `prova: true`: servono a collaudare la catena
#     (tabella -> controllo -> derivata -> modulo -> scheda -> indice), NON a dire come va
#     il mondo. ### NESSUNA FISICA E' DECISA QUI.
leggi:

  # ------------------------------------------------------------------ il salto d'arco
  - id: PROVA-HOPPING
    tipo: termine_arco
    prova: true
    espressione: >-
      -K*(psi_i_0c*psi_j_0 + psi_i_1c*psi_j_1 + psi_j_0c*psi_i_0 + psi_j_1c*psi_i_1)
    ambito: [psi]
    # ### LE SIMMETRIE (punto 3): U(1) e- il minimo che il mandato chiede. ### E lo
    # ### SCAMBIO DEI CAPI c-e- perche- il grafo e- NON ORIENTATO -- ed e- la stessa
    # ### proprieta- che il punto 4 ha MISURATO numericamente (scambiando ii e jj su
    # ### tutti gli archi lo stato resta IDENTICO AL BIT). ### Qui si verifica
    # ### SIMBOLICAMENTE: due vie diverse sulla stessa cosa.
    simmetrie: [U1-FASE-GLOBALE, SCAMBIO-DEI-CAPI]
    # ### LA NORMA SI CONSERVA PER NOETHER, dalla U(1). ### L-ENERGIA NO, e non e- un
    # ### difetto della legge: e- l-INTEGRATORE che la conserva solo approssimata --
    # ### misurato 3.9e-05 contro la soglia DERIVATA dt^2 = 1.0e-04.
    conserva: [NORMA]
    parametri:
      K:
        valore: 1.0
        # ### K MOLTIPLICA UN ADIMENSIONALE E IL TERMINE ENTRA IN H: quindi K E-
        # ### UN-ENERGIA. ### Non e- una scelta: e- cio- che la coerenza impone.
        dimensione: E^1
        origine: >-
          ### VALORE DI PROVA, NON DERIVATO. `A1` pretende che un numero dica da dove
          viene: questo viene DA NIENTE, ed e' per questo che la legge e'
          `prova: true`. Una legge di fisica con un parametro cosi' NON SI SCRIVE.
    assiomi: [A16]
    scheda: >-
      Il salto fra due nodi, nella forma BILINEARE `psi_i^dag (...) psi_j + c.c.`.
      E' il termine piu' semplice che accoppia due nodi, e serve a collaudare che il
      generatore sappia: (1) distinguere i due capi di un arco, (2) derivare rispetto ai
      coniugati di ENTRAMBI, (3) accumulare il gradiente sui due capi con `np.add.at`.
      ### NON E' LA LEGGE DEL SALTO: e' la FORMA PIU' SEMPLICE che ha quella forma.

  # ------------------------------------------------------------------ il termine locale
  - id: PROVA-LOCALE
    tipo: termine_nodo
    prova: true
    espressione: (g/2)*(psi_0c*psi_0 + psi_1c*psi_1)**2
    ambito: [psi]
    # ### ⚠ E QUI LO SCAMBIO DEI CAPI NON SI DICHIARA, e non e- una dimenticanza:
    # ### e- un termine di NODO, e non ha due capi. ### Dichiararlo darebbe una
    # ### sostituzione CHE NON TOCCA NESSUN SIMBOLO, cioe- un FALSO-UNO -- e il
    # ### presidio lo RIFIUTA proprio per questo.
    simmetrie: [U1-FASE-GLOBALE]
    conserva: [NORMA]
    parametri:
      g:
        valore: 0.5
        # ### g moltiplica (psi^dag psi)^2, che e- adimensionale: g E- UN-ENERGIA.
        dimensione: E^1
        origine: >-
          ### VALORE DI PROVA, NON DERIVATO. Come `K`: viene DA NIENTE.
    assiomi: [A16, A17]
    scheda: >-
      Il termine locale `(g/2) (psi^dag psi)^2`: dipende SOLO dal nodo, e serve a
      collaudare che il generatore sappia (1) derivare una NON LINEARITA', (2) tenere il
      termine di nodo CIECO sui vicini -- i simboli `psi_i`/`psi_j` NON ESISTONO nel suo
      ambiente. ### Soddisfa `A17` perche' non nomina nessuna posizione: non potrebbe,
      il simbolo e' VIETATO.

  # ------------------------------------------------------------------ l-osservatore
  #     ### UN OSSERVATORE LEGGE E NON SCRIVE, e `P-E5` NON SI FIDA della regola
  #     ### scritta: fa girare `misura()` e confronta lo stato AL BYTE.
  - id: PROVA-NORMA
    tipo: osservatore
    # ### ⛔ UN OSSERVATORE DICHIARA LA SUA DIMENSIONE, e non deve essere E^1: la
    # ### NORMA e- un CONTEGGIO, cioe- E^0. ### Pretendere E^1 da ogni osservatore
    # ### VIETEREBBE DI MISURARE LA NORMA, che e- la prima cosa che si misura.
    dimensione: E^0
    simmetrie: [U1-FASE-GLOBALE]
    # ### ⛔ UN OSSERVATORE NON CONSERVA NIENTE: MISURA. ### La lista VUOTA lo DICE,
    # ### e <<non dichiarato>> sarebbe un-altra cosa.
    conserva: []
    prova: true
    espressione: psi_0c*psi_0 + psi_1c*psi_1
    ambito: [psi]
    voce: MISURA-NORMA-ERA2
    assiomi: [A16, A17]
    scheda: >-
      La NORMA TOTALE, somma su tutti i nodi di psi^dag psi. Serve a due cose, e
      nessuna delle due e' fisica: (1) rendere `P-E5` UNA MISURA invece di un braccio
      vero e vuoto -- prima di questa riga non c'era NESSUN osservatore, e il presidio
      passava senza provare niente; (2) dare all'integratore la grandezza su cui si
      misura la conservazione, perche' la norma e' l'invariante QUADRATICO che un
      metodo simmetrico conserva. ### Soddisfa `A17` perche' e' DICHIARATO strumento:
      non entra in H, non ha gradiente, e il generatore non gliene calcola uno.

  # ==================================================================================
  #  LA FISICA DELLA CAMMINATA -- i pezzi del passo, il flusso, e la forma SPENTA
  # ----------------------------------------------------------------------------------
  #  ### ⛔ QUESTE NON SONO LEGGI DI PROVA: `prova: false`. Vengono dalla CARTA DELLA
  #  ### FISICA (`CARTA-FISICA-SIMULATORE`), che Luca ha deciso il 2026-10-12, e sono
  #  ### la fisica GIA' MISURATA sul banco congelato -- non fisica nuova.
  #  ### ⭐ E IL CONTO DELLE LEGGI NON SALE: la tabella TOGLIE una duplicazione, perche'
  #  ### oggi la stessa fisica vive nel BANCO CONGELATO E qui.
  #  ### ⚠ IL FRAME (`n`, `U`) NON E' UNA VARIABILE DI QUESTA TABELLA, ed e' una scelta
  #  ### dichiarata: i versori sono PROVVISORI (`PROVV-VERSORI-NON-RELAZIONALI`, posto
  #  ### `A5`) e `U` e' FERMA finche' la `U` dinamica non si deriva (posto `A2`).
  #  ### Metterli fra le variabili di stato direbbe che sono DECISI, e non lo sono.
  # ==================================================================================

  # ---------------------------------------------------------------- F1: la moneta di spin
  - id: CAMM-MONETA-SPIN
    tipo: pezzo_unitario
    prova: false
    operatore: moneta_spin
    azione: estremita
    ambito: [psi_h]
    parametri:
      eps:
        valore: 0.5
        dimensione: E^1
        origine: >-
          ### IL VALORE DEL BANCO, NON UNA TARATURA. `0.5` e' il valore con cui tutte le
          letture del banco congelato sono state fatte, e il CRITERIO DI PASSAGGIO
          pretende che il generato riproduca quelle letture: cambiarlo qui vorrebbe dire
          confrontare DUE ESPERIMENTI. ### La sua origine FISICA resta aperta, ed e' il
          posto `A1` (il tempo proprio locale): `eps * dtau` e' cio' che conta, e la
          forma di `dtau` NON e' decisa.
    simmetrie: [U1-FASE-GLOBALE]
    assiomi: [A16, A13]
    scheda: >-
      `exp(-i eps dtau sigma.n)` per ESTREMITA' (punto `F1`). E' qui che SPIN e DIREZIONE
      si legano, ed e' ESATTA e non un'esponenziale numerica: `exp(-i a sigma.n) =
      cos a I - i sin a (sigma.n)` perche' `(sigma.n)^2 = I` quando `|n| = 1`. ### Quindi
      nessun errore di troncamento, e la forma e' UNITARIA AL BIT.
      ### AZIONE `estremita`: agisce su una estremita' per volta, e NON legge il vicino.

  # ---------------------------------------------------------------- F1: il Grover
  - id: CAMM-GROVER
    tipo: pezzo_unitario
    prova: false
    operatore: grover
    azione: nodo
    ambito: [psi_h]
    parametri: {}
    simmetrie: [U1-FASE-GLOBALE]
    assiomi: [A16]
    scheda: >-
      `(2/d) Somma - I` nel NODO (punto `F1`): mescola le estremita' di uno stesso nodo,
      ed e' un'INVOLUZIONE (`G^2 = I`). ### NON HA PARAMETRI, e non e' una semplificazione:
      il `2/d` viene dal GRADO del nodo, cioe' da una proprieta' del grafo -- `A1` e'
      rispettato perche' non c'e' nessun numero da tarare.
      ### AZIONE `nodo`: e' il SOLO pezzo che mescola estremita' diverse dello stesso
      nodo, ed e' per questo che NON si puo' scrivere come espressione in questo formato
      (un termine di nodo non vede i vicini): e' il posto `P4` del piano.

  # ---------------------------------------------------------------- F1 e F2: lo spostamento
  - id: CAMM-SPOSTAMENTO
    tipo: pezzo_unitario
    prova: false
    operatore: spostamento_trasporto
    azione: arco
    ambito: [psi_h]
    parametri: {}
    simmetrie: [U1-FASE-GLOBALE]
    assiomi: [A13, A16]
    scheda: >-
      `psi'[partner(h)] = U[h] psi[h]` (punti `F1` e `F2`): E' IL CONO, un arco per tick,
      cioe' LA VELOCITA' DELLA LUCE del sistema. ### E' una PERMUTAZIONE composta col
      trasporto `U(2)`, e non un prodotto matrice-vettore: la parte `U(1)` di `U` e'
      l'elettromagnetismo, la parte `SU(2)` la geometria.
      ### E `A13` c'e' perche' la SCALA MINIMA E' UN ARCO: sotto l'arco non esiste
      niente, nemmeno una distanza.
      ### AZIONE `arco`: scambia le due estremita' dello stesso arco.

  # ---------------------------------------------------------------- F4: il vuoto
  - id: CAMM-GROVER-VUOTO
    tipo: pezzo_unitario
    prova: false
    operatore: grover_scalare
    azione: nodo
    ambito: [phi_h]
    parametri: {}
    simmetrie: [U1-FASE-GLOBALE]
    assiomi: [A16]
    scheda: >-
      Il Grover sul vuoto `phi` (punto `F4`), che e' uno SCALARE NEUTRO. ### Mescola le
      estremita' del nodo come quello dello spinore, e la differenza sta nel pezzo dopo:
      il vuoto si sposta SENZA `U`.
  - id: CAMM-SPOSTAMENTO-VUOTO
    tipo: pezzo_unitario
    prova: false
    operatore: spostamento_scalare
    azione: arco
    ambito: [phi_h]
    parametri: {}
    simmetrie: [U1-FASE-GLOBALE]
    assiomi: [A13]
    scheda: >-
      Lo spostamento del vuoto (punto `F4`), SENZA `U`. ### E il <<senza `U`>> non e' una
      semplificazione: `phi` e' NEUTRO, quindi non ha carica da trasportare -- e dargli
      una `U` vorrebbe dire dargli una carica che non ha.

  # ---------------------------------------------------------------- F5: la saturazione
  - id: CAMM-SATURAZIONE
    tipo: flusso
    prova: false
    generatore: Lambda*(h_int/Lambda - atan(h_int/Lambda))
    esatto: true
    ambito: [psi_h, phi_h, Lambda, h_int]
    parametri: {}
    simmetrie: [U1-FASE-GLOBALE]
    conserva: [NORMA]
    scheda: >-
      La saturazione `N_k = Lambda_k G(h_k / Lambda_k)` con `G(x) = x - arctan x`
      (punto `F5`). ### SENZA NESSUNA COSTANTE `g`, e la scala e' IL VUOTO LOCALE: e'
      questo che rende il termine RELAZIONALE invece di tarato.
      ### `esatto: true` NON E' UNA PROMESSA: il flusso si integra in forma CHIUSA, e un
      collaudo lo verifica -- un flusso <<esatto>> che sbaglia all'ordine `dtau^2`
      sarebbe un flusso APPROSSIMATO CHE MENTE.
      ### E LA SUA DERIVATA E' AL PIU' `1` (`G'(x) = x^2/(1+x^2)`), che e' il fatto
      misurato dietro l'ipotesi <<la saturazione e' una LENTE e non una BUCA>>
      (`PERCHE-NON-LEGA`).
    assiomi: [A1, A16]

  # ---------------------------------------------------------------- F6: la forma (D), SPENTA
  - id: CAMM-FORMA-D
    tipo: flusso
    prova: false
    # ### ⛔ IL POSTO APERTO, E LA SUA VOCE: questa legge appartiene al posto `A4`
    # ### (il segno della saturazione), e la sua decisione e- `DOMANDA-QUALE-SEGNO`,
    # ### che e- APERTA. ### Finche- quella voce non e- decisa, il generatore IMPEDISCE
    # ### di metterla nell-ordine di composizione -- cioe- di ACCENDERLA.
    posto: A4
    voce_decisione: DOMANDA-QUALE-SEGNO
    generatore: Lambda*(h_int/Lambda - atan(h_int/Lambda))
    esatto: true
    ambito: [psi_h, phi_h, Lambda, h_int]
    parametri: {}
    simmetrie: [U1-FASE-GLOBALE]
    conserva: [NORMA]
    scheda: >-
      La forma `(D)` dell'auto-interazione dell'interferenza (punto `F6`), DICHIARATA
      SPENTA: NON entra nell'ordine di composizione, e il suo posto nella tabella serve a
      dire CHE ESISTE e che il suo posto e' dichiarato.
      ### ⛔ PERCHE' SPENTA, con un numero: sulla scena principale a `26000` nodi il segno
      diretto di questa forma e' PEGGIO del lineare -- meno `21.6%` della frazione entro
      un arco, a `6.5 sigma` (`doc/REFERTO_legame.md`). ### Non e' neutro: e'
      SFAVOREVOLE.
      ### E IL SUO SEGNO E' UN POSTO APERTO (`DOMANDA-QUALE-SEGNO`): la domanda non e' piu'
      <<quale segno lega>> ma <<quale segno serve QUANDO IL CAMPO C'E'>>, e si decide
      sulla prova con la `U` dinamica accesa.
    assiomi: [A1]
