# ====================================================================================
#  LA TABELLA DEGLI OSSERVATORI -- separata dalle leggi, e di proposito
# ------------------------------------------------------------------------------------
#  PERCHE- SEPARATA: un osservatore NON E' FISICA (A17). Tenerlo nella stessa tabella
#  delle leggi inviterebbe a scriverci UNA LEGGE TRAVESTITA DA MISURA.
#
#  IL FORMATO DI UN OSSERVATORE
#    id            come le leggi
#    tipo          osservatore
#    espressione   stringa simbolica (sympy)
#    ambito        le variabili che PUO- leggere
#    voce          ### L-ID DELLA VOCE MISURA/CRITERIO CHE CALCOLA. Senza, non si scrive.
#    prova, scheda, assiomi   come le leggi
#
#  ### E GLI OSSERVATORI LEGGONO: NON SCRIVONO MAI. `P-E5` non si fida della regola
#  ### scritta -- un collaudo FA GIRARE ogni osservatore e verifica che lo stato sia
#  ### BYTE-IDENTICO prima e dopo. Una regola che dice <<non scrivere>> e' UNA TENDA (A9);
#  ### un confronto al byte E' UNA MISURA.
# ====================================================================================
versione: 1
osservatori: []
